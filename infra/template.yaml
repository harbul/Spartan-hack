# StillHere SAM template: Lambda (FastAPI + Mangum), HTTP API, DynamoDB tables,
# photo bucket, EventBridge Scheduler escalation check, IAM,
# and the browser map API key.
# Deploy from infra/: `sam build && sam deploy --guided`.
# Amplify Hosting (frontend) is connected to the repo in the console, not here.
#
# Implements: PLAN.md §6 (architecture), §7 (tables), §5 (1-minute escalation schedule).
# Owner: P2 (Backend and infra).
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StillHere - emergency response command center (SpartHill Hacks 2026)

Parameters:
  BedrockFastModelId:
    Type: String
    Description: Cross-region inference profile ID for the fast model (confirm in hour 0)
  BedrockStrongModelId:
    Type: String
    Description: Cross-region inference profile ID for the strong model (confirm in hour 0)
  BedrockFallbackModelId:
    Type: String
    Default: ""
    Description: Fallback model ID if access to the main ones is slow or denied (PLAN.md §16)
  BedrockGuardrailId:
    Type: String
    Default: ""
    Description: Optional. An existing advice guardrail to use instead of the one this stack creates (PLAN.md §4 Job 6)
  BedrockGuardrailVersion:
    Type: String
    Default: DRAFT
  LocationApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional. Amazon Location API key for Routes; leave empty to use the Lambda role.

Conditions:
  HasFallbackModel: !Not [!Equals [!Ref BedrockFallbackModelId, ""]]
  HasGuardrailParam: !Not [!Equals [!Ref BedrockGuardrailId, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30 # HTTP API caps requests at 30 s; the agent targets ~20 s (PLAN.md §17)
    MemorySize: 1024
    Environment:
      Variables:
        BEDROCK_FAST_MODEL_ID: !Ref BedrockFastModelId
        BEDROCK_STRONG_MODEL_ID: !Ref BedrockStrongModelId
        BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
        BEDROCK_GUARDRAIL_ID: !If [HasGuardrailParam, !Ref BedrockGuardrailId, !GetAtt AdviceGuardrail.GuardrailId]
        BEDROCK_GUARDRAIL_VERSION: !If [HasGuardrailParam, !Ref BedrockGuardrailVersion, DRAFT]
        BEDROCK_PII_GUARDRAIL_ID: !GetAtt PiiGuardrail.GuardrailId
        BEDROCK_PII_GUARDRAIL_VERSION: DRAFT
        LOCATION_API_KEY: !Ref LocationApiKey
        RESIDENTS_TABLE: !Ref ResidentsTable
        OUTAGES_TABLE: !Ref OutagesTable
        CASES_TABLE: !Ref CasesTable
        MESSAGES_TABLE: !Ref MessagesTable
        PLANS_TABLE: !Ref PlansTable
        TRACES_TABLE: !Ref TracesTable
        EVENTS_TABLE: !Ref EventsTable
        CONFIG_TABLE: !Ref ConfigTable
        PHOTOS_BUCKET: !Ref PhotosBucket

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"] # TODO(P2): restrict to the Amplify URL and localhost
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.main.handler
      # TODO(P2): /demo/reset reseeds from data/, which is outside CodeUri.
      # See docs/PROGRESS.md, Open questions.
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        # Real-time silence check (PLAN.md §5); main.handler routes this Input.
        EscalationCheck:
          Type: ScheduleV2 # EventBridge Scheduler
          Properties:
            ScheduleExpression: rate(1 minute)
            Input: '{"stillhere": "escalation_check"}'
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ResidentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref OutagesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CasesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref MessagesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PlansTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TracesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EventsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigTable }
        - S3CrudPolicy: { BucketName: !Ref PhotosBucket }
        - Statement:
            # Converse needs bedrock:InvokeModel, only on the configured model IDs.
            # Each ID may be a cross-region inference profile (us.*, global.*) or a plain model ID.
            - Sid: BedrockConfiguredModels
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockFastModelId}
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockStrongModelId}
                - !If
                  - HasFallbackModel
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockFallbackModelId}
                  - !Ref AWS::NoValue
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockFastModelId}
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockStrongModelId}
                - !If
                  - HasFallbackModel
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockFallbackModelId}
                  - !Ref AWS::NoValue
            # A cross-region profile routes to the foundation model in several regions;
            # allow that only when the call comes through one of our profiles.
            - Sid: BedrockModelsBehindOurProfiles
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn:
                    - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockFastModelId}
                    - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockStrongModelId}
                    - !If
                      - HasFallbackModel
                      - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockFallbackModelId}
                      - !Ref AWS::NoValue
            # Job 6: Converse with guardrailConfig and ApplyGuardrail both need this.
            - Sid: BedrockGuardrails
              Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource:
                - !If
                  - HasGuardrailParam
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}
                  - !GetAtt AdviceGuardrail.GuardrailArn
                - !GetAtt PiiGuardrail.GuardrailArn
            - Sid: AmazonLocationRoutes # location.py: stop order and road routes (Job 5)
              Effect: Allow
              Action:
                - geo-routes:OptimizeWaypoints
                - geo-routes:CalculateRoutes
              Resource: !Sub arn:${AWS::Partition}:geo-routes:${AWS::Region}::provider/default

  # --- DynamoDB tables (PLAN.md §7), all on-demand ---------------------------
  # Named <stack>-<table> so local runs can use the .env.example names (stack `stillhere`).

  ResidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-residents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: resident_id, AttributeType: S }]
      KeySchema: [{ AttributeName: resident_id, KeyType: HASH }]

  OutagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-outages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: outage_id, AttributeType: S }]
      KeySchema: [{ AttributeName: outage_id, KeyType: HASH }]

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-cases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: outage_id, AttributeType: S }
        - { AttributeName: resident_id, AttributeType: S }
      KeySchema:
        - { AttributeName: outage_id, KeyType: HASH }
        - { AttributeName: resident_id, KeyType: RANGE }

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: resident_id, AttributeType: S }
        - { AttributeName: ts, AttributeType: S }
      KeySchema:
        - { AttributeName: resident_id, KeyType: HASH }
        - { AttributeName: ts, KeyType: RANGE }

  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-plans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: plan_id, AttributeType: S }]
      KeySchema: [{ AttributeName: plan_id, KeyType: HASH }]

  TracesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-traces
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: trace_id, AttributeType: S }]
      KeySchema: [{ AttributeName: trace_id, KeyType: HASH }]
      # TODO(P2): GET /traces?limit=50 wants newest first; scan + sort is fine at demo scale.

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-events
      BillingMode: PAY_PER_REQUEST
      # Sort key "<ts>#<write order>": many events can share a virtual timestamp.
      AttributeDefinitions:
        - { AttributeName: outage_id, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: outage_id, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: key, AttributeType: S }]
      KeySchema: [{ AttributeName: key, KeyType: HASH }]

  # --- S3: reply photos ------------------------------------------------------

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --- Amazon Location ---------------------------------------------------------
  # Browser map key (VITE_LOCATION_API_KEY): map tiles only, in this region.
  # CloudFormation can't output the key value; get it with the command in the
  # MapsApiKeyName output. The key ships in the frontend bundle, so it is public.
  # TODO(P2): add Restrictions.AllowReferers for the Amplify URL and localhost.
  MapsApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub ${AWS::StackName}-maps
      Description: StillHere browser map (Maps API tiles, styles, glyphs, sprites)
      NoExpiry: true
      Restrictions:
        AllowActions: ["geo-maps:*"]
        AllowResources:
          - !Sub arn:${AWS::Partition}:geo-maps:${AWS::Region}::provider/default

  # --- Bedrock Guardrails (PLAN.md §4 Job 6) ------------------------------------
  # Two, because PII filters on the SMS jobs would also mask the resident's own name.
  # Both are used at their DRAFT version (no publish step needed for the demo).

  AdviceGuardrail: # on every resident-facing SMS (Jobs 1, 4) and to screen replies
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ${AWS::StackName}-advice
      Description: StillHere never gives medical advice; a person at the county handles it.
      BlockedInputMessaging: This message was passed to a person at Santa Clara County.
      BlockedOutputsMessaging: Santa Clara County is checking on you. Reply 1 if you are OK, 2 if you need help.
      TopicPolicyConfig:
        TopicsConfig:
          - Name: MedicalAdvice
            Type: DENY
            Definition: >-
              Advice or instructions about medication doses, changing or skipping a treatment,
              or how to set or adjust medical equipment such as oxygen, dialysis or insulin pumps.
            Examples:
              - How much extra insulin should I take?
              - Can I skip dialysis tonight?
              - Should I turn my oxygen flow down so the tank lasts longer?

  PiiGuardrail: # trace rows only, through ApplyGuardrail (bedrock.mask_pii)
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ${AWS::StackName}-pii
      Description: Masks names, addresses and phone numbers in AI Trace rows.
      BlockedInputMessaging: "[masked]"
      BlockedOutputsMessaging: "[masked]"
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - { Type: NAME, Action: ANONYMIZE }
          - { Type: ADDRESS, Action: ANONYMIZE }
          - { Type: PHONE, Action: ANONYMIZE }

Outputs:
  ApiUrl:
    Description: Base URL for VITE_API_URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  MapsApiKeyName:
    Description: >-
      VITE_LOCATION_API_KEY value: aws location describe-key --key-name <this>
      --query Key --output text
    Value: !Sub ${AWS::StackName}-maps
  PhotosBucketName:
    Value: !Ref PhotosBucket
  AdviceGuardrailId:
    Description: BEDROCK_GUARDRAIL_ID for local runs
    Value: !GetAtt AdviceGuardrail.GuardrailId
  PiiGuardrailId:
    Description: BEDROCK_PII_GUARDRAIL_ID for local runs
    Value: !GetAtt PiiGuardrail.GuardrailId
